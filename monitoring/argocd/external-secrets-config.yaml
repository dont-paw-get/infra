# ServiceAccount(IRSA) + ClusterSecretStore + ExternalSecret 2종 (monitoring/external-secrets/).
# external-secrets Application(wave -2)이 만드는 CRD에 의존하므로 그 다음 wave에서 동기화한다.
# kube-prometheus-stack(Grafana)과 alerting이 이 ExternalSecret들이 만드는 Secret에 의존한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dont-paw-get/infra.git
    targetRevision: develop
    path: monitoring/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # external-secrets(wave -2)가 CRD를 설치한 직후에도 API 서버의 discovery 캐시가
    # 즉시 갱신되지 않아 "could not find the requested resource"로 실패할 수 있다.
    # 재시도 백오프를 늘려 discovery 캐시가 갱신될 때까지 자동으로 기다리게 한다.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
