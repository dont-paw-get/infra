# ServiceAccount(IRSA) + ClusterSecretStore + ExternalSecret 2종 (monitoring/external-secrets/).
# external-secrets Application(wave -2)이 만드는 CRD에 의존하므로 그 다음 wave에서 동기화한다.
# kube-prometheus-stack(Grafana)과 alerting이 이 ExternalSecret들이 만드는 Secret에 의존한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dont-paw-get/infra.git
    targetRevision: develop
    path: monitoring/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
