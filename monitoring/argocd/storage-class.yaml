# EKS Auto Mode용 EBS StorageClass(monitoring/storage-class/). kube-prometheus-stack/Loki(wave 0)의
# PVC가 이 StorageClass를 참조하므로 그보다 먼저(wave -2) 동기화되어야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-class
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dont-paw-get/infra.git
    targetRevision: develop
    path: monitoring/storage-class
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
