# Helm 차트는 업스트림 repo에서, values는 이 저장소(monitoring/kube-prometheus-stack/values.yaml)에서 가져오는 멀티소스 구성.
# grafana-admin-credentials/discord-webhook Secret(ExternalSecret이 생성, wave -1)에 의존하므로 wave 0으로 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # TODO(docs/adr/0003-argocd-gitops.md 미결정): 최초 부트스트랩 시 최신 안정 버전으로 고정.
      targetRevision: "<CHART_VERSION>"
      helm:
        valueFiles:
          - $values/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/dont-paw-get/infra.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
