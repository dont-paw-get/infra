# External Secrets Operator 자체(CRD + 컨트롤러) 설치.
# ClusterSecretStore/ExternalSecret CR(monitoring/external-secrets/)이 이 CRD에 의존하므로
# sync-wave를 가장 낮게 두어 먼저 동기화되도록 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # TODO(docs/adr/0003-argocd-gitops.md 미결정): 최초 부트스트랩 시 `helm search repo external-secrets/external-secrets`로 최신 안정 버전 확인 후 고정.
    targetRevision: "<CHART_VERSION>"
    helm:
      releaseName: external-secrets
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
