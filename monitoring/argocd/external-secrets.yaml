# External Secrets Operator 자체(CRD + 컨트롤러) 설치.
# ClusterSecretStore/ExternalSecret CR(monitoring/external-secrets/)이 이 CRD에 의존하므로
# sync-wave를 가장 낮게 두어 먼저 동기화되도록 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # artifacthub.io 기준 2026-08-24 확인한 최신 안정 버전. 이후 갱신 시 `helm search repo external-secrets/external-secrets`로 재확인.
    targetRevision: "2.9.0"
    helm:
      releaseName: external-secrets
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
