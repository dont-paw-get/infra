# grafana/loki Helm chart
# 단일 바이너리(SingleBinary) 모드로 시작한다. 트래픽/보존 요구가 커지면 SimpleScalable 모드로 전환 검토.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # TODO(open issue, ADR-0001): 오브젝트 스토리지(S3 등) 연동 여부 확정 전까지 로컬 파일시스템 사용.
  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # TODO(open issue, ADR-0001): 로그 보존 기간 확정 전까지의 임시값.
  limits_config:
    retention_period: 336h # 14d

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

# SimpleScalable 타겟(read/write/backend)은 차트 기본값이 replicas: 3이라
# deploymentMode: SingleBinary와 함께 두면 `helm template`이 검증 에러를 낸다 — 명시적으로 0으로 둔다.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true

test:
  enabled: false
