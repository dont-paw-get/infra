# Grafana Alerting provisioning: HTTP 5xx 에러율
# datasourceUid "prometheus"는 kube-prometheus-stack이 자동 생성하는 기본 Prometheus 데이터소스의 uid다.
# 대상 메트릭(http_server_requests_seconds_count)은 Micrometer 기준 이름 — 서비스가 다른 클라이언트를 쓰면 조정 필요.
# threshold(0.02 = 2%)·게이트(0.5 req/s)는 SLO 기준 1차 정리값(2026-09-03). 실트래픽 분포 확인 후 재조정 대상 — .harness/PLAN.md, DECISIONS.md.
# refId A의 `and sum(rate(count[5m])) by (application) >= 0.5`는 최소 트래픽 게이트다(CLIAR-261에서 0.2로 도입, SLO 재조정 시 0.5로 상향).
# 5분에 150건(0.5 req/s) 미만인 서비스는 5xx 1건만으로 에러율이 급등하므로 평가에서 제외한다.
apiVersion: 1

groups:
  - orgId: 1
    name: http-error-rate
    folder: Cluster Alerts
    interval: 1m
    rules:
      - uid: http-5xx-error-rate
        title: "HTTP 5xx 에러율 초과"
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application)
                  /
                  sum(rate(http_server_requests_seconds_count[5m])) by (application)
                )
                and
                sum(rate(http_server_requests_seconds_count[5m])) by (application) >= 0.5
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.02]
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 서비스의 5xx 에러율이 2%를 초과했습니다"
