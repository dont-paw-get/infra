# Grafana Alerting provisioning: p99 레이턴시 초과
# TODO(open issue, ADR-0001): threshold(1s)는 러프한 초기값. 트래픽 파악 후 튜닝.
# refId A의 `and sum(rate(...count[5m])) by (application) >= 0.2`는 최소 트래픽 게이트다(CLIAR-261).
# 5분에 60건(0.2 req/s) 미만인 서비스는 표본이 적어 p99가 요청 1건에 통째로 끌려가므로 평가에서 제외한다.
# 이 게이트값(0.2)도 실트래픽 분포 확인 후 튜닝 대상.
apiVersion: 1

groups:
  - orgId: 1
    name: latency
    folder: Cluster Alerts
    interval: 1m
    rules:
      - uid: http-p99-latency
        title: "p99 레이턴시 초과"
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.99,
                  sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application)
                )
                and
                sum(rate(http_server_requests_seconds_count[5m])) by (application) >= 0.2
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 서비스의 p99 레이턴시가 1초를 초과했습니다"
