# Grafana Alerting provisioning: p99 레이턴시 초과
# TODO(open issue, ADR-0001): threshold(1s)는 러프한 초기값. 트래픽 파악 후 튜닝.
apiVersion: 1

groups:
  - orgId: 1
    name: latency
    folder: Cluster Alerts
    interval: 1m
    rules:
      - uid: http-p99-latency
        title: "p99 레이턴시 초과"
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.99,
                  sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application)
                )
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 서비스의 p99 레이턴시가 1초를 초과했습니다"
