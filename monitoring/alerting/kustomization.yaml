# 기존 provisioning YAML(원본 내용은 그대로 두고)을 grafana_alert=1 라벨의 ConfigMap으로 감싼다.
# kube-prometheus-stack의 grafana sidecar.alerts가 이 라벨을 감시해 자동으로 provisioning에 반영한다.
# 과거 scripts/install.sh의 envsubst + kubectl create configmap 로직을 대체 (docs/adr/0003-argocd-gitops.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_alert: "1"

configMapGenerator:
  - name: grafana-alerting-discord
    files:
      - contact-points/discord.yaml
  - name: grafana-alerting-notification-policy
    files:
      - policies/notification-policy.yaml
  # http-error-rate / latency: backend-* 서비스가 Micrometer(http_server_requests_seconds_*)를 노출하고
  # 각 서비스 저장소 dev overlay에 ServiceMonitor를 두면서 재추가(2026-09-02, CLIAR-238). 5개 서비스
  # (auth/book/librarian/record/discovery) 모두 application 라벨을 붙인 Micrometer 표준 이름이라 규칙 쿼리는
  # 수정하지 않았다 — .harness/ARCHITECTURE.md "서비스 저장소와의 경계" 표 참고.
  - name: grafana-alerting-http-error-rate
    files:
      - rules/http-error-rate.yaml
  - name: grafana-alerting-latency
    files:
      - rules/latency.yaml
  - name: grafana-alerting-log-error-spike
    files:
      - rules/log-error-spike.yaml
  - name: grafana-alerting-pod-health
    files:
      - rules/pod-health.yaml
  - name: grafana-alerting-pvc-usage
    files:
      - rules/pvc-usage.yaml
