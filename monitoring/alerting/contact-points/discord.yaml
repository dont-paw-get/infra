# Grafana Alerting provisioning: Discord contact point
# 배포 시 grafana sidecar(provisioning) 또는 grafana ConfigMap으로 마운트한다.
# 실제 웹훅 URL은 여기 두지 않는다 — secrets/README.md 참고 (ExternalSecret → grafana 파드 env var 주입).
# $__env{}는 Grafana 자체의 provisioning 파일 환경변수 확장 문법이다 (셸 envsubst가 아님).
#
# RCA Agent용 webhook receiver는 임시 제거된 상태다 (2026-08-29).
# 같은 contact point에 두면 Grafana가 두 receiver를 한 묶음으로 처리해서, rca-agent 전송이 실패할 때
# receiver 전체 notify가 실패로 처리되어 Discord 알림까지 중복 재시도되고 결국 드롭됐다
# (ADR-0002 결정 #3의 "두 경로 독립"이 실제로는 성립하지 않았음 — .harness/DECISIONS.md 2026-08-29 참고).
# 별도 contact point + notification policy의 continue 라우팅으로 재도입 예정 — .harness/PLAN.md 참고.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-webhook
    receivers:
      - uid: discord-webhook-receiver
        type: discord
        settings:
          url: "$__env{DISCORD_WEBHOOK_URL}"
          use_discord_username: false
        disableResolveMessage: false
