# Grafana Alerting provisioning: 알림 라우팅 정책
#
# 모든 알림을 두 contact point에 각각 보낸다:
#   - rca-agent-webhook : RCA Agent 트리거 (continue: true 라 다음 route도 계속 평가된다)
#   - discord-webhook   : 사람이 보는 Discord 알림
# 두 route가 분리되어 있어야 Grafana가 각 경로의 성공/실패를 독립적으로 판정한다 —
# 한 contact point에 두 receiver를 넣으면 RCA Agent 장애가 Discord 알림까지 망가뜨린다
# (ADR-0002 결정 #3, 2026-08-29 실제 발생 — .harness/DECISIONS.md 참고).
#
# 하위 route는 matcher가 없어 모든 알림에 매칭되고, group_by/타이밍은 루트 정책에서 상속한다.
# 알림이 늘어나면 서비스/심각도별 route를 추가로 세분화한다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-webhook
    group_by: ["alertname", "namespace"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: rca-agent-webhook
        continue: true
      - receiver: discord-webhook
