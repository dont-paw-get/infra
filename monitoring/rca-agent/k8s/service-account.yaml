# IRSA(ServiceAccount ↔ IAM Role)로 Agent 파드가 Bedrock을 호출할 때 사용한다.
# IAM Role(dpgy-infra-rca-agent) 생성 완료(2026-08-25, AWS Console) — 신뢰 정책은 이 ServiceAccount(sub)로 좁혀져 있고,
# 권한은 bedrock:InvokeModel(WithResponseStream)을 arn:aws:bedrock:ap-northeast-2::foundation-model/anthropic.claude-sonnet-5로 스코프.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent-irsa
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::594532711953:role/dpgy-infra-rca-agent"
