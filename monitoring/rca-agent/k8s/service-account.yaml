# IRSA(ServiceAccount ↔ IAM Role)로 Agent 파드가 Bedrock을 호출할 때 사용한다.
# IAM Role(dpgy-infra-rca-agent) 자체와 신뢰 정책(OIDC 프로바이더)은 이 저장소 범위 밖에서 생성해야 한다.
# Bedrock 권한 범위(모델 access, 리전 등)는 아직 미확정 — docs/adr/0002-anomaly-rca-agent.md 미결정 항목 참고.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent-irsa
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::594532711953:role/dpgy-infra-rca-agent"
