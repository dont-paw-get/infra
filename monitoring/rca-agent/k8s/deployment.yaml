# 이미지 저장소/빌드 파이프라인(ECR, CI)은 아직 이 저장소에 없다 — image는 부트스트랩 전 실제 값으로 교체해야 하는 placeholder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-agent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-agent
  template:
    metadata:
      labels:
        app: rca-agent
    spec:
      serviceAccountName: rca-agent-irsa
      containers:
        - name: rca-agent
          image: "594532711953.dkr.ecr.ap-northeast-2.amazonaws.com/dpgy-infra-rca-agent:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rca-agent-config
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          # 기본값(timeoutSeconds 1, failureThreshold 3)은 너무 빡빡해 파드가 반복 재시작했다
          # (2026-08-29 실제 발생, RESTARTS 53 — .harness/DECISIONS.md 참고).
          # 분석은 백그라운드 스레드로 옮겼지만(main.py), probe 자체도 여유를 둔다.
          # liveness 를 readiness 보다 느슨하게 잡아 일시적 지연에 파드가 죽지 않게 한다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
