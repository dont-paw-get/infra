# AWS Secrets Manager를 백엔드로 하는 ClusterSecretStore.
# 인증은 IRSA(service-account.yaml의 external-secrets-irsa)를 사용한다 — AWS 액세스 키를 시크릿으로 두지 않는다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-irsa
            namespace: monitoring
