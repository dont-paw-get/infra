# AWS Secrets Manager의 dpgy-infra/grafana-admin-credentials 시크릿(JSON: admin-user, admin-password 키)을
# grafana-admin-credentials K8s Secret으로 동기화한다. kube-prometheus-stack values.yaml의
# grafana.admin.existingSecret이 이 이름을 참조한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dpgy-infra/grafana-admin-credentials
