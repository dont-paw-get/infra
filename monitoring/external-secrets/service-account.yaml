# IRSA(ServiceAccount ↔ IAM Role)로 ClusterSecretStore가 AWS Secrets Manager에 접근할 때 사용한다.
# role-arn은 실제 AWS 계정 ID/Role 이름으로 교체해야 한다 (docs/adr/0003-argocd-gitops.md 미결정 참고).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-irsa
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/dpgy-infra-external-secrets"
