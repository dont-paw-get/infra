# IRSA(ServiceAccount ↔ IAM Role)로 ClusterSecretStore가 AWS Secrets Manager에 접근할 때 사용한다.
# 계정 ID는 사용자 확인(2026-08-24) — backend-auth 저장소의 ECR 계정 ID와 동일.
# IAM Role(dpgy-infra-external-secrets) 생성 완료(2026-08-25, AWS Console) — 신뢰 정책은 이 ServiceAccount(sub)로 좁혀져 있고,
# 권한은 secretsmanager:GetSecretValue/DescribeSecret을 arn:aws:secretsmanager:ap-northeast-2:594532711953:secret:dpgy-infra/*로 스코프.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-irsa
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::594532711953:role/dpgy-infra-external-secrets"
