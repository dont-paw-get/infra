# 시나리오 C — 로그 ERROR 급증
#
# 5초마다 JSON 구조화 로그(level=ERROR)를 stdout으로 출력 → 분당 12건 (임계 5건 초과).
# 전제: loki-0 Running + Alloy DaemonSet 정상 (로그가 Loki까지 도달해야 함).
# 알림: monitoring/alerting/rules/log-error-spike.yaml  "로그 ERROR 급증"  (for 5m)
#   expr: sum by (app) (count_over_time({namespace=~".+"} | json | level="ERROR" [5m])) > 5
#   Loki 라벨 app 은 Alloy가 파드의 app.kubernetes.io/name 에서 채운다 → app=rca-test-logspike
# 기대: apply 후 ~5-6분이면 발화 → Discord 원본 알림 + "RCA: 로그 ERROR 급증"
#
# 정리: kubectl delete -f test/rca-scenarios/phase2/C-log-error-spike.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-test-logspike
  namespace: rca-test
  labels:
    rca-test: "true"
    app: rca-test-logspike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-test-logspike
  template:
    metadata:
      labels:
        app: rca-test-logspike
        app.kubernetes.io/name: rca-test-logspike
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while true; do
                i=$((i + 1))
                echo "{\"level\":\"ERROR\",\"msg\":\"simulated error $i\",\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
